# .github/workflows/dlog.yml on each 2.1.A-groupN branch.
# Every push that touches 2.1.A/ runs the profiler on that group's file and
# puts the report on the run's page (Actions tab -> the run -> Summary).
name: Discrete log profile
on:
  push:
    branches: ["2.1.A-group*"]
    paths: ["2.1.A/**"]
  workflow_dispatch:
    inputs:
      full:
        description: "Full run: every function on every challenge, 3 s each (slow)"
        type: boolean
        default: false
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install line_profiler
      - name: Profile this group's dlog functions
        run: |
          n="${GITHUB_REF_NAME##*group}"
          if [ "${{ inputs.full }}" = "true" ]; then
            opts="--time-limit 3 --give-up 0"
          else
            opts="--time-limit 2 --give-up 3"
          fi
          PYTHONPATH=. python 2.1.A/dlog_profile.py "2.1.A/group$n.py" \
            --markdown $opts >> "$GITHUB_STEP_SUMMARY"
