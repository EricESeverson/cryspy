# .github/workflows/tests.yml: run the unit tests on every push.
# Results: the commit gets a green check or red X; the run page shows a table.
name: Unit tests
on:
  push:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Run tests
        run: |
          status=0
          PYTHONPATH=. python -m pytest tests -q --tb=line \
            --junitxml=report.xml || status=$?
          python .github/test_summary.py report.xml >> "$GITHUB_STEP_SUMMARY"
          exit $status
